services:
  postgres:
    image: postgres:16-alpine
    container_name: copilote-qa-postgres
    environment:
      POSTGRES_DB: copilote_qa
      POSTGRES_USER: copilote
      POSTGRES_PASSWORD: copilote
    ports:
      - "5432:5432"
    volumes:
      - copilote_qa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilote -d copilote_qa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  copilote_qa_postgres:

